[env]
framework = arduino
lib_deps =
	mathertel/RotaryEncoder@1.6.0
	adafruit/Adafruit SSD1306@2.5.17
	mathertel/OneButton@2.6.2
	arduino-irremote/IRremote@4.7.1

[env:s2mini]
platform = espressif32
board = lolin_s2_mini
monitor_speed = 115200

